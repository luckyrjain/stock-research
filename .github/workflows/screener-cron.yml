name: Custom Screener Pipeline

on:
  schedule:
    # 19:00 IST (UTC+5:30) on weekdays = 13:30 UTC. Runs after sme-cron.yml
    # (13:00 UTC) so that pipeline's own writes have settled, and after NSE's
    # 15:30 IST close plus a buffer for end-of-day data to settle.
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run custom screener pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DATABASE_URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add a network-reachable Postgres connection string in repo Settings > Secrets and variables > Actions > New repository secret (name: DATABASE_URL) before this workflow can run."
            exit 1
          fi

      - name: Run custom screener pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python screener_pipeline.py
