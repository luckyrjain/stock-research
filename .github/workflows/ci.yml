name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Only used by the dedicated Alembic step below — the main `pytest
      # tests/` step runs exactly as before, with DATABASE_URL unset, same
      # as any contributor's local run without Postgres configured.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockresearch
          POSTGRES_PASSWORD: stockresearch
          POSTGRES_DB: stockresearch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify Alembic migrations against a real Postgres
        # DATABASE_URL scoped to this one step only — see
        # tests/test_alembic_migrations.py's own docstring for why it isn't
        # set for the main `pytest tests/` step above.
        env:
          DATABASE_URL: postgresql://stockresearch:stockresearch@localhost:5432/stockresearch_ci
        run: python -m pytest tests/test_alembic_migrations.py -v

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        # tsc --noEmit alone doesn't catch everything — e.g. a CSS syntax
        # error only surfaces under the production minifier, not tsc or
        # `next dev`. Build once here so that class of bug can't land silently.
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        # No FastAPI backend is started in this job — every test mocks its
        # own backend responses at the browser network layer (see
        # playwright.config.ts's own comment on why). npm run dev (started
        # automatically via webServer in playwright.config.ts) is enough.
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
