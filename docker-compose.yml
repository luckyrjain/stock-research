# Local/self-hosted deployment. Needs a .env file (copy .env.example) with
# at least one LLM provider key; DATABASE_URL and REDIS_URL are set here to
# point at the postgres/redis services below, so leave both unset in .env
# for this compose setup.
#
#   docker compose up --build
#
# Backend:  http://localhost:8000
# Frontend: http://localhost:3000
#
# First run only, to create the SME tables:
#   docker compose exec backend python sme_ema_pipeline.py --setup-db

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockresearch}
      POSTGRES_DB: ${POSTGRES_DB:-stockresearch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockresearch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Backs the rate limiter / LLM concurrency ceiling / SME refresh lock in
  # rate_limiter.py — only load-bearing once you scale the backend past one
  # worker/replica (see docs/deployment.md's "Scaling" section). A single
  # worker (this compose file's default) works identically with or without
  # it; included by default so `docker compose up --workers N` later just
  # works without a compose file change.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockresearch}:${POSTGRES_PASSWORD:-stockresearch}@postgres:5432/${POSTGRES_DB:-stockresearch}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000
      # Only load-bearing once a reverse proxy sits in front of the frontend
      # container (see docs/deployment.md) and sets X-Forwarded-For on
      # requests reaching it — this compose file's default single-host setup
      # exposes the frontend directly, so there's no real forwarded IP for
      # either service to trust without one. Set TRUSTED_PROXY_SECRET in .env
      # to the same value here and on the frontend service once that's in
      # place; empty (the default) is a safe no-op on both sides.
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      API_URL: http://backend:8000
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_output:
